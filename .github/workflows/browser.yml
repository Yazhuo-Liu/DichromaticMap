name: Browser checks

on:
  workflow_call:
    inputs:
      check-core:
        type: boolean
        default: false
      upload-pages-artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Cache the pinned Pyodide runtime
        uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ hashFiles('site/use_worker.js') }}
      - name: Install numerical, documentation and browser test dependencies
        run: |
          python -m pip install -e ".[test,browser]"
          python -m playwright install --with-deps chromium
      - name: Check the deployed numerical core
        if: inputs.check-core
        run: python scripts/run_tests.py --suite core
      - name: Build and check the static site
        run: |
          python scripts/build_site.py
          python scripts/smoke_web.py
          node --check site/index.js
          node --check site/use.js
          node --check site/gpu_renderer.js
          node --check site/tutorial.js
          node --input-type=module --check < site/use_worker.js
          node --test site/*.test.js site/*.test.mjs
      - name: Check the real Chromium, Pyodide and GPU workflows
        run: python scripts/smoke_browser.py
      - name: Save browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-diagnostics
          path: .cache/browser-smoke
          if-no-files-found: ignore
      - name: Upload the tested Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/_build
