name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/dichromatic_map/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "packaging/**"
      - "scripts/build_site.py"
      - "scripts/build_docs.py"
      - "scripts/smoke_browser.py"
      - "scripts/smoke_web.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/browser.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/browser.yml
    with:
      check-core: true
      upload-pages-artifact: true

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
