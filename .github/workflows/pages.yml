name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/dichromatic_map/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "packaging/**"
      - "scripts/build_site.py"
      - "scripts/build_docs.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site
        run: |
          python -m pip install ".[site]"
          python scripts/build_site.py
      - name: Check browser adapter
        run: |
          python -m pip install numpy
          python scripts/smoke_web.py
          node --check site/index.js
          node --check site/use.js
          node --check site/tutorial.js
          node --input-type=module --check < site/use_worker.js
          node site/mobile_interactions.test.js
          node site/tutorial.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/_build
      - id: deployment
        uses: actions/deploy-pages@v4
