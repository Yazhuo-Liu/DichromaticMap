[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dichromatic-map"
version = "0.2.2"
description = "Layer-resolved cubic tilt grain-boundary dichromatic patterns"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.urls]
Homepage = "https://yazhuoliu.com/DichromaticMap/"
Documentation = "https://yazhuoliu.com/DichromaticMap/docs/en/index.html"
Source = "https://github.com/Yazhuo-Liu/DichromaticMap"
Issues = "https://github.com/Yazhuo-Liu/DichromaticMap/issues"

[project.optional-dependencies]
gui = ["PySide6", "pyqtgraph"]
test = ["pytest>=8", "build>=1.2", "setuptools>=77.0.3", "wheel", "packaging>=22", "Markdown>=3.8,<4"]
site = ["Markdown>=3.8,<4"]
browser = ["playwright>=1.49,<2"]
bundle = ["pyinstaller>=6.16,<7"]

[project.scripts]
dichromatic-map = "dichromatic_map.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dichromatic_map.ui" = ["resources/*.qss", "resources/icons/*.svg"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers -ra -p no:cacheprovider"
markers = [
    "gui: offscreen Qt interaction and rendering tests (requires the gui extra)",
    "packaging: build and verify source and wheel distributions",
]
